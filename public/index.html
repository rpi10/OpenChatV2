<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat App</title>
  <link rel="stylesheet" href="/styles.css"> 
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <div id="login-box">
      <h2>Login</h2>
      <input id="username-input" type="text" placeholder="Enter your username" />
      <input id="password-input" type="password" placeholder="Enter your password" />
      <button id="login-button">Login</button>
    </div>
  </div>

  <!-- Chat Interface -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Users</h2>
      <!-- Plus button to add external database -->
      <button id="add-database-btn" title="Add External Database">+</button>
    </div>
    <ul id="users-list"></ul>
  </div>
  <div id="chat-area">
    <h2 id="chat-header">Chat</h2>
    <ul id="messages"></ul>

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" style="display: none;" />
    <div id="audioPreviewContainer"></div>
    <!-- Message Form -->
    <form id="form" action="">
      <!-- Attachment Button -->
      <button type="button" id="attachButton" title="Attach a file"></button>
      
      <!-- Message Input -->
      <input id="input" autocomplete="off" placeholder="Type a message..."/>
    
      <!-- Record Button -->
      <button type="button" id="recordButton" title="Hold to record voice"></button>
    
      <!-- Send Button -->
      <button type="submit" id="send"></button>
    </form>
  </div>

  <!-- Modal for External Database Linking -->
  <div id="link-database-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close" id="close-modal">&times;</span>
      <p>Your Authentificator: <span id="your-authenticator"></span></p>
      <input id="external-authenticator-input" type="text" placeholder="Enter external authentificator" />
      <button id="link-database-submit">Link Database</button>
    </div>
  </div>

  <!-- Notification sound -->
  <audio id="beep-sound" src="ring-tone.mp3" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
